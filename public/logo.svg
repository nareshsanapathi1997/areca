<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153826"/>
      <stop offset="100%" stop-color="#0F281B"/>
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D06F"/>
      <stop offset="50%" stop-color="#E0A96D"/>
      <stop offset="100%" stop-color="#C5832B"/>
    </linearGradient>
    <linearGradient id="logoLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95D5B2"/>
      <stop offset="50%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Rounded Shield / Medallion -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#logoBgGrad)" stroke="url(#logoGoldGrad)" stroke-width="2.5" filter="url(#logoShadow)"/>
    
    <!-- Inner Accent Ring -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#2D6A4F" stroke-width="1.2" stroke-dasharray="3 2"/>

    <!-- Areca Palm Leaf Frond -->
    <g transform="translate(50,54) rotate(-12) translate(-50,-54)">
      <!-- Leaf Silhouette -->
      <path d="M50 18 C61 32 70 50 67 69 C65 79 56 86 50 88 C44 86 35 79 33 69 C30 50 39 32 50 18 Z" 
            fill="url(#logoLeafGrad)"/>
      <path d="M50 18 C58 31 64 48 61 66 C59 76 53 82 50 88 C50 78 52 56 50 18 Z" 
            fill="#D8F3DC" opacity="0.7"/>
      <!-- Vein Spine -->
      <path d="M50 20 Q50 55 50 90" stroke="url(#logoGoldGrad)" stroke-width="2" stroke-linecap="round"/>
      <!-- Vein Ribs -->
      <path d="M50 32 Q57 28 62 34 M50 43 Q58 39 64 46 M50 55 Q59 52 64 59" 
            stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M50 35 Q43 31 38 37 M50 46 Q42 42 36 49 M50 58 Q41 55 36 62" 
            stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Top Spire Crown -->
    <path d="M50 9 L53 17 L50 15 L47 17 Z" fill="url(#logoGoldGrad)"/>
    <circle cx="50" cy="8" r="2.5" fill="#F4D06F"/>

    <!-- Plate Foundation Arch -->
    <path d="M25 80 Q50 94 75 80" fill="none" stroke="url(#logoGoldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(130, 26)">
    <!-- Brand Primary Name -->
    <text x="0" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#153826" letter-spacing="1.5">
      HANUMAN
    </text>
    <text x="195" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#C5832B" letter-spacing="1.5">
      .
    </text>
    
    <!-- Secondary Name -->
    <text x="0" y="65" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#2D6A4F" letter-spacing="3.5">
      ENTERPRISES
    </text>

    <!-- Tagline / Descriptor -->
    <text x="0" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#6B4F35" letter-spacing="2.2" text-transform="uppercase">
      100% NATURAL ARECA PALM LEAF TABLEWARE
    </text>
  </g>
</svg>
