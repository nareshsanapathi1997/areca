      <stop offset="50%" stop-color="#2D8A4E" />
      <stop offset="100%" stop-color="#74C69D" />
    </linearGradient>
  </defs>

  <!-- Rounded Premium Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2.5" />

