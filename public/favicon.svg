      <stop offset="0%" stop-color="#153826" />
      <stop offset="100%" stop-color="#0B1E14" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CD" />
      <stop offset="35%" stop-color="#F3CE65" />
      <stop offset="70%" stop-color="#D49B37" />
      <stop offset="100%" stop-color="#8C5812" />
    </linearGradient>
    <linearGradient id="favLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
