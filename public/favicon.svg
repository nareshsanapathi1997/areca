    <path d="M46 92 C32 80 18 74 4 72 C16 84 30 90 46 92 Z" fill="url(#favGold)" />
    <path d="M51 110 C36 100 20 96 5 95 C18 104 34 109 51 110 Z" fill="url(#favGold)" />
    <path d="M58 128 C42 120 25 118 10 119 C24 126 40 128 58 128 Z" fill="url(#favGold)" />

    <!-- Left Column of 'H' -->
    <polygon points="52,32 108,32 108,38 94,38 94,162 108,162 108,168 52,168 52,162 68,162 68,38 52,38" fill="url(#favGold)" />

    <!-- Right Column of 'H' -->
    <polygon points="144,32 200,32 200,38 184,38 184,162 200,162 200,168 144,168 144,162 160,162 160,38 144,38" fill="url(#favGold)" />

    <!-- Ribbon Crossbar of 'H' -->
    <path d="M68 108 C80 96 110 88 145 92 C172 95 195 80 215 56 C210 74 195 106 160 114 C128 120 95 116 68 108 Z" fill="url(#favGold)" />

    <!-- Emerald Leaves on Right Column -->
