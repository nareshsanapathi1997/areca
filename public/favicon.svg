      <path d="M10 15 C24 10 38 8 50 12 C38 18 24 20 10 15 Z" fill="url(#favLeaf)" />
      <path d="M10 32 C26 28 42 28 54 35 C40 40 24 39 10 32 Z" fill="url(#favLeaf)" />
      <path d="M8 50 C24 48 40 52 50 62 C36 64 22 60 8 50 Z" fill="url(#favLeaf)" />
    </g>
  </g>
</svg>
