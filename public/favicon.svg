    <path d="M174 165 C185 138 200 118 218 102 C214 125 204 148 185 168 Z" fill="url(#favLeaf)" />
    <path d="M152 168 C144 145 138 128 140 110 C150 126 156 148 158 168 Z" fill="url(#favLeaf)" />

    <!-- Right side fronds -->
