<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280">
  <defs>
    <!-- Background Gradient & Subtle Linen Pattern -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F6F2EC" />
    </linearGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="bGoldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F4CF67" />
      <stop offset="55%" stop-color="#D49A36" />
      <stop offset="85%" stop-color="#B87B1D" />
      <stop offset="100%" stop-color="#80500A" />
    </linearGradient>

    <linearGradient id="bGoldRibbon" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#F7D774" />
      <stop offset="60%" stop-color="#D89E34" />
      <stop offset="90%" stop-color="#9E6813" />
      <stop offset="100%" stop-color="#E2B258" />
    </linearGradient>

    <linearGradient id="bGoldPalm" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#A56E22" />
      <stop offset="40%" stop-color="#DCA842" />
      <stop offset="80%" stop-color="#F7DF8D" />
      <stop offset="100%" stop-color="#C58C28" />
    </linearGradient>

    <linearGradient id="bEmeraldLeaf" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0A3319" />
      <stop offset="40%" stop-color="#185E34" />
      <stop offset="80%" stop-color="#2D8A4E" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>

    <linearGradient id="bEmeraldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E4222" />
      <stop offset="50%" stop-color="#1B6D3B" />
      <stop offset="90%" stop-color="#40916C" />
      <stop offset="100%" stop-color="#74C69D" />
    </linearGradient>

    <!-- Wood Slice Gradients -->
    <radialGradient id="woodBark" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#D7AB7A" />
      <stop offset="92%" stop-color="#9E6C38" />
      <stop offset="98%" stop-color="#5C3B18" />
      <stop offset="100%" stop-color="#3D240E" />
    </radialGradient>

    <radialGradient id="woodInner" cx="48%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#EED6B3" />
      <stop offset="45%" stop-color="#E2C29A" />
      <stop offset="80%" stop-color="#D4AB7D" />
      <stop offset="100%" stop-color="#C29361" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="naturalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#102518" flood-opacity="0.18" />
    </filter>

    <filter id="softEmblemShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1100" height="280" fill="url(#bannerBg)" rx="16" />

  <!-- TOP-LEFT: Authentic Areca Palm Frond Branch -->
  <g id="top-left-palm" filter="url(#naturalShadow)">
    <!-- Central Branch Stem -->
    <path d="M-40 -40 Q50 60 180 180" stroke="#1D4E32" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Radiating Leaflets -->
    <path d="M0 -10 C35 15 70 30 110 38 C75 35 40 18 0 -10 Z" fill="#2D6A4F" />
    <path d="M15 15 C55 45 95 65 140 78 C100 70 60 48 15 15 Z" fill="#1B5E20" />
    <path d="M30 40 C75 75 125 100 175 115 C130 102 85 75 30 40 Z" fill="#2E7D32" />
    <path d="M45 65 C95 105 150 135 205 150 C160 135 105 105 45 65 Z" fill="#1B4332" />
    <path d="M60 90 C110 130 170 160 220 180 C175 162 120 132 60 90 Z" fill="#388E3C" />
    <path d="M75 115 C125 155 180 185 230 205 C185 188 135 155 75 115 Z" fill="#2D6A4F" />
    <path d="M90 140 C135 175 185 205 235 225 C195 210 150 178 90 140 Z" fill="#40916C" />
  </g>

  <!-- TOP-RIGHT: Natural Rustic Wood Platter & Palm Frond -->
  <g id="top-right-decor" transform="translate(930, 20)" filter="url(#naturalShadow)">
    <!-- Wood Slice Cross Section -->
    <ellipse cx="90" cy="50" rx="95" ry="90" fill="url(#woodBark)" transform="rotate(-15 90 50)" />
    <ellipse cx="90" cy="50" rx="84" ry="80" fill="url(#woodInner)" transform="rotate(-15 90 50)" />
    <!-- Tree Growth Rings -->
    <ellipse cx="90" cy="50" rx="66" ry="62" fill="none" stroke="#BA8752" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.6" transform="rotate(-15 90 50)" />
    <ellipse cx="90" cy="50" rx="46" ry="43" fill="none" stroke="#A77440" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.55" transform="rotate(-15 90 50)" />
    <ellipse cx="90" cy="50" rx="26" ry="24" fill="none" stroke="#8E5E2F" stroke-width="1.5" opacity="0.5" transform="rotate(-15 90 50)" />
    <!-- Palm Leaf cascading over the wood platter -->
    <path d="M60 -30 Q40 60 0 160" stroke="#133E26" stroke-width="3" fill="none" />
    <path d="M45 0 C25 25 10 60 0 100 C15 75 30 45 45 0 Z" fill="#2D6A4F" />
    <path d="M35 30 C15 60 0 100 -12 140 C5 110 20 75 35 30 Z" fill="#1B5E20" />
    <path d="M25 60 C5 95 -10 135 -20 175 C-4 140 10 100 25 60 Z" fill="#388E3C" />
    <path d="M15 90 C-5 125 -20 165 -30 205 C-15 170 -2 130 15 90 Z" fill="#52B788" />
  </g>

  <!-- CENTER BRAND LOGO LOCKUP -->
  <g id="center-logo" transform="translate(180, 50)" filter="url(#softEmblemShadow)">
    
    <!-- EMBLEM: Golden 'H' with foliage -->
    <g id="emblem-group" transform="translate(0, 5)">
      <!-- Golden Left Palm Fronds -->
      <g id="banner-gold-left">
        <path d="M66 128 C50 105 36 80 34 50" fill="none" stroke="#C58C28" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
        <path d="M34 50 C28 38 18 32 8 30 C15 41 24 48 34 50 Z" fill="url(#bGoldPalm)" />
        <path d="M36 63 C26 52 16 46 5 44 C14 54 25 61 36 63 Z" fill="url(#bGoldPalm)" />
        <path d="M40 77 C29 67 17 62 4 61 C15 70 28 76 40 77 Z" fill="url(#bGoldPalm)" />
        <path d="M45 93 C32 84 18 80 5 80 C17 88 31 92 45 93 Z" fill="url(#bGoldPalm)" />
        <path d="M52 108 C39 101 24 99 11 100 C23 106 37 108 52 108 Z" fill="url(#bGoldPalm)" />
        <path d="M59 122 C46 117 31 118 18 122 C30 126 44 125 59 122 Z" fill="url(#bGoldPalm)" />
        <path d="M37 57 C41 48 47 43 54 40 C50 48 44 55 37 57 Z" fill="url(#bGoldPalm)" opacity="0.9" />
        <path d="M41 71 C46 64 53 60 60 57 C55 65 49 70 41 71 Z" fill="url(#bGoldPalm)" opacity="0.9" />
      </g>

      <!-- Letter 'H' Left Column -->
      <polygon points="46,26 94,26 94,32 82,32 82,136 94,136 94,142 46,142 46,136 60,136 60,32 46,32" fill="url(#bGoldH)" />
      <line x1="64" y1="30" x2="64" y2="138" stroke="#FFF7D6" stroke-width="1.5" opacity="0.75" />
      <line x1="78" y1="30" x2="78" y2="138" stroke="#664005" stroke-width="1.5" opacity="0.35" />

      <!-- Letter 'H' Right Column -->
      <polygon points="126,26 174,26 174,32 160,32 160,136 174,136 174,142 126,142 126,136 140,136 140,32 126,32" fill="url(#bGoldH)" />
      <line x1="144" y1="30" x2="144" y2="138" stroke="#FFF7D6" stroke-width="1.5" opacity="0.75" />
      <line x1="156" y1="30" x2="156" y2="138" stroke="#664005" stroke-width="1.5" opacity="0.35" />

      <!-- Sweeping Ribbon Crossbar -->
      <g id="banner-ribbon">
        <path d="M60 92 C71 81 97 74 128 78 C152 80 172 68 190 46 C185 63 172 89 141 96 C112 101 83 98 60 92 Z" 
              fill="url(#bGoldRibbon)" filter="url(#softEmblemShadow)" />
        <path d="M128 78 C152 80 172 68 190 46 C178 69 155 88 130 88 Z" 
              fill="#8F580F" opacity="0.55" />
        <path d="M64 90 C89 80 124 80 155 86 C173 78 184 61 189 48" 
              fill="none" stroke="#FFF9E0" stroke-width="1.4" stroke-linecap="round" opacity="0.9" />
      </g>

      <!-- Emerald Foliage on Right Column -->
      <g id="banner-emerald-leaves">
        <path d="M139 142 C141 118 148 96 156 79 C163 93 163 116 157 142 Z" fill="url(#bEmeraldLeaf)" />
        <path d="M147 142 Q151 113 156 79" fill="none" stroke="#A7F3D0" stroke-width="1.2" opacity="0.8" />

        <path d="M153 140 C163 117 176 100 191 86 C187 105 179 125 163 142 Z" fill="url(#bEmeraldBright)" />
        <path d="M156 140 Q171 117 191 86" fill="none" stroke="#C2F0D5" stroke-width="1.2" opacity="0.75" />

        <path d="M133 142 C126 122 121 107 123 92 C131 106 136 125 139 142 Z" fill="url(#bEmeraldLeaf)" opacity="0.95" />

        <g transform="translate(150, 75)">
          <path d="M8 13 C21 8 33 7 45 10 C33 15 21 17 8 13 Z" fill="url(#bEmeraldBright)" />
          <path d="M8 27 C22 23 37 23 48 30 C36 34 22 33 8 27 Z" fill="url(#bEmeraldLeaf)" />
          <path d="M7 43 C21 41 36 44 45 52 C32 54 19 51 7 43 Z" fill="url(#bEmeraldBright)" />
          <path d="M5 57 C18 57 30 64 37 75 C25 75 14 68 5 57 Z" fill="url(#bEmeraldLeaf)" />
        </g>

        <path d="M149 142 C154 126 163 113 174 105 C170 119 165 131 156 142 Z" fill="url(#bGoldPalm)" />
      </g>
    </g>

    <!-- WORDMARK & TAGLINE -->
    <g id="banner-text" transform="translate(230, 30)">
      <!-- Main Brand Name: Hanuma Enterprises -->
      <text x="0" y="66" 
            font-family="'Newsreader', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
            font-size="62" 
            font-weight="700" 
            fill="#0D3B24" 
            letter-spacing="0.4">
        Hanuma Enterprises
      </text>

      <!-- Subtitle: 100% Biodegradable • Eco-Friendly • Chemical-Free -->
      <g transform="translate(4, 108)">
        <text x="0" y="0" 
              font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" 
              font-size="19" 
              font-weight="600" 
              fill="#1E4330" 
              letter-spacing="1.5">
          100% Biodegradable
        </text>
        
        <circle cx="216" cy="-5" r="3.5" fill="#C58C28" />

        <text x="236" y="0" 
              font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" 
              font-size="19" 
              font-weight="600" 
              fill="#1E4330" 
              letter-spacing="1.5">
          Eco-Friendly
        </text>

        <circle cx="386" cy="-5" r="3.5" fill="#C58C28" />

        <text x="406" y="0" 
              font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" 
              font-size="19" 
              font-weight="600" 
              fill="#1E4330" 
              letter-spacing="1.5">
          Chemical-Free
        </text>
      </g>
    </g>
  </g>
</svg>
