<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" width="740" height="160">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldHBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F4CF67" />
      <stop offset="55%" stop-color="#D49A36" />
      <stop offset="85%" stop-color="#B87B1D" />
      <stop offset="100%" stop-color="#80500A" />
    </linearGradient>

    <linearGradient id="goldRibbonFlow" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#F7D774" />
      <stop offset="60%" stop-color="#D89E34" />
      <stop offset="90%" stop-color="#9E6813" />
      <stop offset="100%" stop-color="#E2B258" />
    </linearGradient>

    <linearGradient id="goldPalmFrond" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#A56E22" />
      <stop offset="40%" stop-color="#DCA842" />
      <stop offset="80%" stop-color="#F7DF8D" />
      <stop offset="100%" stop-color="#C58C28" />
    </linearGradient>

    <!-- Emerald Leaf Gradients -->
    <linearGradient id="emeraldLeafDeep" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0A3319" />
      <stop offset="40%" stop-color="#185E34" />
      <stop offset="80%" stop-color="#2D8A4E" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>

    <linearGradient id="emeraldLeafBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E4222" />
      <stop offset="50%" stop-color="#1B6D3B" />
      <stop offset="90%" stop-color="#40916C" />
      <stop offset="100%" stop-color="#74C69D" />
    </linearGradient>

    <filter id="subtleDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Group: The H Emblem with Intertwined Leaves -->
  <g id="header-emblem" transform="translate(15, 10)" filter="url(#subtleDrop)">
    
    <!-- LEFT SIDE: Golden Palm Fronds branching outwards -->
    <g id="left-gold-leaves">
      <path d="M56 105 C42 86 30 65 28 42" fill="none" stroke="#C58C28" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      <path d="M28 42 C23 31 16 26 7 24 C13 33 21 40 28 42 Z" fill="url(#goldPalmFrond)" />
      <path d="M30 53 C22 43 14 38 4 36 C12 45 21 51 30 53 Z" fill="url(#goldPalmFrond)" />
      <path d="M33 65 C24 56 14 52 3 51 C12 59 23 64 33 65 Z" fill="url(#goldPalmFrond)" />
      <path d="M37 78 C27 70 15 67 4 66 C14 73 26 77 37 78 Z" fill="url(#goldPalmFrond)" />
      <path d="M43 91 C32 85 19 83 8 84 C19 89 31 91 43 91 Z" fill="url(#goldPalmFrond)" />
      <path d="M49 103 C38 98 26 99 15 102 C25 106 37 105 49 103 Z" fill="url(#goldPalmFrond)" />
      <path d="M31 48 C34 40 39 36 45 33 C42 40 37 46 31 48 Z" fill="url(#goldPalmFrond)" opacity="0.9" />
      <path d="M34 60 C38 54 44 50 50 48 C46 55 41 59 34 60 Z" fill="url(#goldPalmFrond)" opacity="0.9" />
    </g>

    <!-- THE LETTER 'H' -->
    <!-- Left Column of 'H' -->
    <g id="h-left-shaft">
      <polygon points="38,22 80,22 80,27 70,27 70,113 80,113 80,118 38,118 38,113 50,113 50,27 38,27" fill="url(#goldHBase)" />
      <line x1="53" y1="25" x2="53" y2="115" stroke="#FFF7D6" stroke-width="1.3" opacity="0.75" />
      <line x1="67" y1="25" x2="67" y2="115" stroke="#664005" stroke-width="1.3" opacity="0.35" />
    </g>

    <!-- Right Column of 'H' -->
    <g id="h-right-shaft">
      <polygon points="106,22 148,22 148,27 136,27 136,113 148,113 148,118 106,118 106,113 118,113 118,27 106,27" fill="url(#goldHBase)" />
      <line x1="121" y1="25" x2="121" y2="115" stroke="#FFF7D6" stroke-width="1.3" opacity="0.75" />
      <line x1="133" y1="25" x2="133" y2="115" stroke="#664005" stroke-width="1.3" opacity="0.35" />
    </g>

    <!-- Dynamic Sweeping Ribbon Crossbar -->
    <g id="h-ribbon-bar">
      <path d="M50 76 C59 67 81 61 107 64 C127 66 144 56 159 38 C155 52 144 74 118 80 C94 84 70 82 50 76 Z" 
            fill="url(#goldRibbonFlow)" filter="url(#subtleDrop)" />
      <path d="M107 64 C127 66 144 56 159 38 C149 57 130 73 109 73 Z" 
            fill="#8F580F" opacity="0.55" />
      <path d="M53 74 C74 66 103 66 129 71 C144 64 153 50 158 40" 
            fill="none" stroke="#FFF9E0" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- RIGHT SIDE & BASE: Emerald Green & Golden Palm Foliage -->
    <g id="right-emerald-leaves">
      <!-- Large Upright Leaf on Right Column -->
      <path d="M117 118 C119 98 125 80 132 66 C138 78 138 97 133 118 Z" fill="url(#emeraldLeafDeep)" />
      <path d="M124 118 Q127 94 132 66" fill="none" stroke="#A7F3D0" stroke-width="1.1" opacity="0.8" />

      <!-- Curved Leaf Arching Out Right -->
      <path d="M129 116 C137 97 148 83 161 71 C158 87 151 104 137 118 Z" fill="url(#emeraldLeafBright)" />
      <path d="M132 116 Q144 97 161 71" fill="none" stroke="#C2F0D5" stroke-width="1" opacity="0.75" />

      <!-- Inner Base Leaflet -->
      <path d="M112 118 C106 101 102 89 104 76 C111 88 115 104 117 118 Z" fill="url(#emeraldLeafDeep)" opacity="0.95" />

      <!-- Frond Leaflets fanning right -->
      <g transform="translate(126, 62)">
        <path d="M7 11 C18 7 28 6 38 9 C28 13 18 15 7 11 Z" fill="url(#emeraldLeafBright)" />
        <path d="M7 23 C19 20 31 20 40 25 C30 29 18 28 7 23 Z" fill="url(#emeraldLeafDeep)" />
        <path d="M6 36 C18 34 30 37 38 44 C27 46 16 43 6 36 Z" fill="url(#emeraldLeafBright)" />
        <path d="M4 48 C15 48 25 54 31 63 C21 63 12 57 4 48 Z" fill="url(#emeraldLeafDeep)" />
      </g>

      <!-- Golden Palm Accent Leaflet -->
      <path d="M126 118 C130 105 138 94 147 87 C144 99 140 109 132 118 Z" fill="url(#goldPalmFrond)" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g id="header-text" transform="translate(205, 30)">
    
    <!-- Wordmark: Hanuma Enterprises in Elegant Serif -->
    <text x="0" y="58" 
          font-family="'Newsreader', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-size="52" 
          font-weight="700" 
          fill="#0D3B24" 
          letter-spacing="0.3">
      Hanuma Enterprises
    </text>

    <!-- Subtitle: 100% Biodegradable • Eco-Friendly • Chemical-Free -->
    <g transform="translate(2, 94)">
      <text x="0" y="0" 
            font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" 
            font-size="16" 
            font-weight="600" 
            fill="#1E4330" 
            letter-spacing="1.2">
        100% Biodegradable
      </text>
      
      <!-- Bullet dot 1 -->
      <circle cx="178" cy="-5" r="3" fill="#C58C28" />

      <text x="194" y="0" 
            font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" 
            font-size="16" 
            font-weight="600" 
            fill="#1E4330" 
            letter-spacing="1.2">
        Eco-Friendly
      </text>

      <!-- Bullet dot 2 -->
      <circle cx="318" cy="-5" r="3" fill="#C58C28" />

      <text x="334" y="0" 
            font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" 
            font-size="16" 
            font-weight="600" 
            fill="#1E4330" 
            letter-spacing="1.2">
        Chemical-Free
      </text>
    </g>
  </g>
</svg>
